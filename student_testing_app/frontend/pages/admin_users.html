<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Správa používateľov</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/design.css?v=21" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount" data-active="admin-users"></div>

    <main class="app-main">
      <div class="app-topbar">
        <div class="app-topbar__greeting">
          <h1 data-i18n="adminU.title">Správa používateľov</h1>
          <p data-i18n="adminU.subtitle">Spravuj role, testy a predtesty používateľov.</p>
        </div>
        <div class="app-topbar__actions" id="topbar-controls"></div>
      </div>

      <div class="card" id="admin-users-card">
        <div class="admin-loading" data-i18n="adminU.loading">Načítavam používateľov…</div>
      </div>
    </main>
  </div>

  <!-- Modál na detail testov -->
  <div class="admin-modal" id="tests-modal" style="display:none;">
    <div class="admin-modal__backdrop" onclick="adminCloseTests()"></div>
    <div class="admin-modal__panel">
      <div class="admin-modal__header">
        <h2 id="tests-modal-title">Testy používateľa</h2>
        <button class="icon-btn" onclick="adminCloseTests()" aria-label="Zavrieť">✕</button>
      </div>
      <div class="admin-modal__body" id="tests-modal-body"></div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/js/session-guard.js?v=21"></script>
  <script src="/js/i18n.js?v=21"></script>
  <script src="/js/sidebar.js?v=21"></script>
  <script src="/js/topbar-controls.js?v=21"></script>
  <script src="/js/admin_users.js?v=21"></script>
</body>
</html>
