<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AdaptPy – Štatistika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/design.css?v=21" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount" data-active="stats"></div>

    <main class="app-main app-main--centered">
      <div class="app-topbar">
        <div class="app-topbar__greeting">
          <h1 data-i18n="stats.title">Štatistika</h1>
          <p data-i18n="stats.subtitle">Prehľad tvojich výsledkov.</p>
        </div>
        <div class="app-topbar__actions" id="topbar-controls"></div>
      </div>

      <div class="centered-card" style="max-width:640px;">
        <!-- Výsledky posledného testu -->
        <div class="card" id="test-result-card" style="display:none; margin-bottom:18px;">
          <div class="stats-hero">
            <div class="stats-donut"><canvas id="circleChart"></canvas></div>
            <div class="stats-big">
              <div class="stats-big__value" id="test-correct">–</div>
              <div class="stats-big__label" data-i18n="stats.correctOfTotal">správnych odpovedí</div>
            </div>
          </div>
          <div id="test-metrics" style="text-align:center; color:var(--text-muted); font-size:0.9rem;"></div>
        </div>

        <!-- Výsledky predtestu podľa kategórií -->
        <div class="card" id="pretest-cats-card" style="display:none;">
          <div class="stats-section-title" data-i18n="stats.pretestByCategory">Výsledky predtestu podľa kategórií</div>
          <div class="cat-list" id="pretest-cats"></div>
        </div>

        <div class="card" id="stats-empty" style="display:none;">
          <div class="stats-empty">
            <div class="stats-empty__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 2 4-6"/></svg>
            </div>
            <div class="stats-empty__title" data-i18n="stats.emptyTitle">Zatiaľ žiadne dáta</div>
            <div class="stats-empty__text" data-i18n="stats.emptyText">Pre tento účet nemáme žiadne výsledky. Najprv absolvuj predtest alebo test a tvoje štatistiky sa ti zobrazia.</div>
            <a class="btn" href="/dashboard" data-i18n="stats.emptyBtn">Späť na prehľad</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/config.js"></script>
  <script src="/js/session-guard.js?v=21"></script>
  <script src="/js/i18n.js?v=21"></script>
  <script src="/js/sidebar.js?v=21"></script>
  <script src="/js/topbar-controls.js?v=21"></script>
  <script src="/js/analyza.js?v=21"></script>
  <script src="/js/script.js?v=21"></script>
  <script> checkAccessCode(); </script>
</body>
</html>
