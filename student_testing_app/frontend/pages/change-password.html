<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Zmena hesla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/design2.css?v=17">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount" data-active="profile"></div>

    <main class="app-main app-main--centered">
      <div class="app-topbar">
        <div class="app-topbar__greeting">
          <h1 data-i18n="change.title">Zmena hesla</h1>
        </div>
        <div class="app-topbar__actions" id="topbar-controls"></div>
      </div>

      <div class="centered-card">
        <div class="card">
          <form id="change-password-form">
            <label data-i18n="change.current" for="current_password">Aktuálne heslo</label>
            <input type="password" id="current_password" autocomplete="current-password" required>
            <label data-i18n="change.new" for="new_password">Nové heslo (min. 8 znakov)</label>
            <input type="password" id="new_password" autocomplete="new-password" required minlength="8">
            <label data-i18n="change.confirm" for="new_password_confirm">Zopakuj nové heslo</label>
            <input type="password" id="new_password_confirm" autocomplete="new-password" required minlength="8">
            <button type="submit" data-i18n="change.submit">Zmeniť heslo</button>
          </form>
          <p id="info-message" class="info-message" style="display:none;"></p>
          <p id="error-message" class="error-message" style="display:none;"></p>

          <span class="bottom-link"><a href="/forgot-password" data-i18n="change.forgot">Zabudol si heslo?</a></span>

          <hr class="divider">
          <a class="btn btn--secondary" href="/dashboard" data-i18n="change.back">Späť na dashboard</a>
        </div>
      </div>
    </main>
  </div>

  <script src="/config.js"></script>
  <script src="/js/i18n.js?v=17"></script>
  <script src="/js/sidebar.js?v=17"></script>
  <script src="/js/topbar-controls.js?v=17"></script>
  <script src="/js/change-password.js?v=17"></script>
</body>
</html>
