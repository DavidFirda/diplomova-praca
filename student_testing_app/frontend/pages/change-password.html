<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zmena hesla</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Zmena hesla</h1>
        <form id="change-password-form">
            <input type="password" id="current_password" placeholder="Aktuálne heslo" autocomplete="current-password" required>
            <input type="password" id="new_password" placeholder="Nové heslo (min. 8 znakov)" autocomplete="new-password" required minlength="8">
            <input type="password" id="new_password_confirm" placeholder="Zopakuj nové heslo" autocomplete="new-password" required minlength="8">
            <button type="submit">Zmeniť heslo</button>
        </form>
        <p id="info-message" class="info-message" style="display: none; text-align: center; color: #1c3f60;"></p>
        <p id="error-message" class="error-message" style="display: none; text-align: center;"></p>
        <a class="bottom-link" href="/">Späť</a>
    </div>

    <script src="/config.js"></script>
    <script src="/js/change-password.js"></script>
</body>
</html>
