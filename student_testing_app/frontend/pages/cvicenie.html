<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Cvičenie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/main.css" />
  <!-- CodeMirror (rovnako ako admin_users.html) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <!-- Markdown render pre text bunky -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount" data-active="exercises"></div>

    <main class="app-main">
      <div class="app-topbar">
        <div class="app-topbar__greeting">
          <h1 data-i18n="ex.workTitle">Cvičenie</h1>
          <p><a href="/cvicenia" data-i18n="ex.backToList">← Späť na zoznam cvičení</a></p>
        </div>
        <div class="app-topbar__actions" id="topbar-controls"></div>
      </div>

      <div id="ex-content">
        <div class="ex-empty" data-i18n="ex.loading">Načítavam cvičenie…</div>
      </div>
    </main>
  </div>

  <script src="/config.js"></script>
  <script src="/js/core/session-guard.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/sidebar.js"></script>
  <script src="/js/core/topbar-controls.js"></script>
  <script src="/js/pages/cvicenie.js"></script>
  <!-- pripravený chatbot (rovnaký skript ako dashboard, napojí sa keď bude panel v DOM) -->
  <script src="/js/pages/chat.js"></script>
</body>
</html>
