<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Spätná väzba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount" data-active="feedback-form"></div>

    <main class="app-main app-main--centered">
      <div class="app-topbar">
        <div class="app-topbar__greeting">
          <h1 data-i18n="ff.title">Spätná väzba</h1>
          <p data-i18n="ff.subtitle">Napíš nám, čo sa ti páči, čo nefunguje alebo čo by sme mali zlepšiť.</p>
        </div>
        <div class="app-topbar__actions" id="topbar-controls"></div>
      </div>

      <div class="centered-card" style="max-width:640px;">
        <div class="card">
          <form id="feedback-form" class="ff" novalidate>
            <fieldset class="ff__group">
              <legend class="ff__label"><span data-i18n="ff.rating">Ako sa ti páči AdaptPy?</span><span class="ff__opt" data-i18n="ff.optional">(nepovinné)</span></legend>
              <div class="ff-stars" id="ff-stars" role="radiogroup">
              <input type="radio" name="rating" id="ff-star-5" value="5">
              <label for="ff-star-5" data-rate="5" title="5/5"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg></label>
              <input type="radio" name="rating" id="ff-star-4" value="4">
              <label for="ff-star-4" data-rate="4" title="4/5"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg></label>
              <input type="radio" name="rating" id="ff-star-3" value="3">
              <label for="ff-star-3" data-rate="3" title="3/5"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg></label>
              <input type="radio" name="rating" id="ff-star-2" value="2">
              <label for="ff-star-2" data-rate="2" title="2/5"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg></label>
              <input type="radio" name="rating" id="ff-star-1" value="1">
              <label for="ff-star-1" data-rate="1" title="1/5"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg></label>
              </div>
              <div class="ff__rating-text" id="ff-rating-text" aria-live="polite"></div>
            </fieldset>

            <fieldset class="ff__group">
              <legend class="ff__label" data-i18n="ff.category">Čoho sa správa týka?</legend>
              <div class="ff-chips">
              <input type="radio" name="category" id="ff-cat-idea" value="idea" checked>
              <label class="ff-chip" for="ff-cat-idea"><svg class="ff-chip__ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span data-i18n="ff.catIdea">Nápad</span></label>
              <input type="radio" name="category" id="ff-cat-bug" value="bug">
              <label class="ff-chip" for="ff-cat-bug"><svg class="ff-chip__ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9a4 4 0 0 1 8 0v6a4 4 0 0 1-8 0zM4 13h4M16 13h4M5 7l3 2M19 7l-3 2M5 19l3-2M19 19l-3-2"/></svg><span data-i18n="ff.catBug">Chyba</span></label>
              <input type="radio" name="category" id="ff-cat-praise" value="praise">
              <label class="ff-chip" for="ff-cat-praise"><svg class="ff-chip__ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11a2 2 0 0 0 2-1.7l1.4-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg><span data-i18n="ff.catPraise">Pochvala</span></label>
              <input type="radio" name="category" id="ff-cat-other" value="other">
              <label class="ff-chip" for="ff-cat-other"><svg class="ff-chip__ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-i18n="ff.catOther">Iné</span></label>
              </div>
            </fieldset>

            <div class="ff__group">
              <label class="ff__label" for="ff-message" data-i18n="ff.message">Tvoja správa</label>
              <textarea id="ff-message" class="ff__textarea" name="message" rows="6" maxlength="2000" data-i18n-placeholder="ff.placeholder" placeholder="Napíš nám, čo sa ti páči, čo nefunguje alebo čo by sme mali zlepšiť…"></textarea>
              <span class="ff__count"><span id="ff-count">0</span> / 2000</span>
            </div>

            <button type="submit" id="ff-submit" class="ff__submit" data-i18n="ff.send">Odoslať</button>
            <p class="admin-hint" id="ff-hint" role="alert"></p>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="/config.js"></script>
  <script src="/js/core/session-guard.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/sidebar.js"></script>
  <script src="/js/core/topbar-controls.js"></script>
  <script src="/js/pages/feedback_form.js"></script>
  <script src="/js/auth/script.js"></script>
  <script> checkAccessCode(); </script>
</body>
</html>
