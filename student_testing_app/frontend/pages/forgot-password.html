<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Zabudnuté heslo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/design.css?v=20">
</head>
<body>
  <div id="navbar"></div>
  <main class="page page--narrow">
    <div class="card">
      <div class="brand-hero">
        <img src="/assets/logo.svg" alt="AdaptPy" class="brand-hero__logo" width="60" height="60" />
        <h1 data-i18n="forgot.title">Zabudnuté heslo</h1>
      </div>
      <p class="text-center" data-i18n="forgot.desc"></p>
      <form id="forgot-password-form">
        <label data-i18n="forgot.email" for="email">Email</label>
        <input type="email" id="email" autocomplete="email" data-i18n-placeholder="forgot.email" required>
        <button type="submit" data-i18n="forgot.submit">Odoslať odkaz na reset</button>
      </form>
      <p id="info-message" class="info-message" style="display:none;"></p>
      <p id="error-message" class="error-message" style="display:none;"></p>
      <span class="bottom-link"><a href="/login" data-i18n="forgot.back">Späť na prihlásenie</a></span>
    </div>
  </main>
  <script src="/config.js"></script>
  <script src="/js/i18n.js?v=20"></script>
  <script src="/js/navbar.js?v=20"></script>
  <script src="/js/script.js?v=20"></script>
</body>
</html>
