<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Zabudnuté heslo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-hero">
        <div class="auth-hero__head">
          <h2 class="auth-hero__title" data-i18n="forgot.heroTitle">Zabudol si heslo?</h2>
          <p class="auth-hero__subtitle" data-i18n="forgot.heroSubtitle">Pošleme ti odkaz na obnovu.</p>
        </div>
        <div class="auth-buddies" id="buddies-mount"></div>
      </div>

      <div class="auth-panel">
        <h1 data-i18n="forgot.title">Obnova hesla</h1>
        <p class="auth-switch-line">
          <span data-i18n="forgot.remembered">Spomenul si si?</span>
          <a href="/login" data-i18n="forgot.backToLogin">Prihlás sa</a>
        </p>

        <form id="forgot-password-form">
          <label data-i18n="forgot.emailLabel" for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="meno@email.sk" required>
          <button type="submit" data-i18n="forgot.submit">Odoslať odkaz na reset</button>
        </form>

        <p id="info-message" class="info-message" style="display:none;"></p>
        <p id="error-message" class="error-message" style="display:none;"></p>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/navbar.js"></script>
  <script src="/js/auth/buddies.js"></script>
  <script src="/js/auth/script.js"></script>
</body>
</html>
