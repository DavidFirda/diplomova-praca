<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zabudnuté heslo</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Zabudnuté heslo</h1>
        <p style="text-align:center; margin-bottom: 15px;">
            Zadaj email, na ktorý si sa registroval. Pošleme ti naň link na nastavenie nového hesla.
        </p>
        <form id="forgot-password-form">
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            <button type="submit">Odoslať link na reset hesla</button>
        </form>
        <p id="info-message" class="info-message" style="display: none; text-align: center; color: #1c3f60;"></p>
        <p id="error-message" class="error-message" style="display: none; text-align: center;"></p>
        <a class="bottom-link" href="/login">Späť na prihlásenie</a>
    </div>

    <script src="/config.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
