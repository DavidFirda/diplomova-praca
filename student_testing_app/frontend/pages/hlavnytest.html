<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Hlavný test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/design.css?v=20">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount" data-active="tests"></div>

    <main class="app-main app-main--centered">
      <div class="app-topbar">
        <div class="app-topbar__greeting">
          <h1 data-i18n="test.main">Hlavný test</h1>
        </div>
        <div class="app-topbar__actions" id="topbar-controls"></div>
      </div>

      <div class="centered-card" style="max-width:720px;">
        <div class="test-card" id="test-container">
          <div class="test-header">
            <span class="test-header__label"><span data-i18n="test.question">Otázka</span>:</span>
            <span class="test-counter" id="question-counter"></span>
          </div>

          <p id="instruction" class="test-instruction"></p>

          <div class="test-input-row">
            <strong><span data-i18n="test.input">Vstup</span>:</strong>
            <div class="test-tooltip">
              <span class="test-tooltip__icon">i</span>
              <span class="test-tooltip__text" data-i18n="test.inputHint">Nezabudni použiť vstup uvedený pri otázke. V niektorých prípadoch budeš potrebovať aj print(). Výstup kódu sa zobrazí pod odpoveďou. Máš maximálne 2 pokusy.</span>
            </div>
          </div>

          <pre id="input" class="test-input-plain"></pre>
          <p class="test-category" id="category"></p>

          <textarea id="student_code" name="code"></textarea>
          <input type="hidden" id="question_id">

          <pre id="output-box" class="test-output"></pre>

          <div id="solution-box" class="test-solution" style="display:none;">
            <h3 data-i18n="test.solution">Správne riešenie:</h3>
            <pre id="solution-code"></pre>
          </div>

          <button id="submit-answer" data-i18n="test.submit">Odpovedať</button>
          <button id="next-question" class="btn--secondary" style="margin-top:10px; display:none;" data-i18n="test.next">Ďalšia otázka</button>
          <p class="test-result" id="result-message"></p>
        </div>
      </div>
    </main>
  </div>

  <script src="/config.js"></script>
  <script src="/js/session-guard.js?v=20"></script>
  <script src="/js/i18n.js?v=20"></script>
  <script src="/js/sidebar.js?v=20"></script>
  <script src="/js/topbar-controls.js?v=20"></script>
  <script src="/js/hlavnytest.js?v=20"></script>
  <script src="/js/script.js?v=20"></script>
  <script> checkAccessCode(); </script>
</body>
</html>
