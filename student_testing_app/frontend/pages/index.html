<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/design2.css?v=20">
</head>
<body>
  <div id="navbar"></div>

  <main class="page page--mid">
    <div class="card">
      <div class="brand-hero">
        <img src="/assets/logo.svg" alt="AdaptPy" class="brand-hero__logo" width="60" height="60" />
        <h1 data-i18n-html="index.title">Vitaj v Adapt<span class="accent-py">Py</span></h1>
        <span class="pill" data-i18n="index.subtitle">Adaptívne precvičovanie programovania v Pythone</span>
      </div>

      <p data-i18n="index.intro"></p>

      <h2 data-i18n="index.how">Ako to funguje</h2>
      <ul class="steps">
        <li><span class="step-num">1</span><span data-i18n="index.step1"></span></li>
        <li><span class="step-num">2</span><span data-i18n="index.step2"></span></li>
        <li><span class="step-num">3</span><span data-i18n="index.step3"></span></li>
        <li><span class="step-num">4</span><span data-i18n="index.step4"></span></li>
        <li><span class="step-num">5</span><span data-i18n="index.step5"></span></li>
      </ul>

      <a class="btn" id="cta-btn" href="/login" data-i18n="index.cta">Začať</a>

      <hr class="divider">
      <p class="muted" style="font-size:0.85rem" data-i18n="index.thesis"></p>
    </div>
  </main>

  <script src="/config.js"></script>
  <script src="/js/i18n.js?v=20"></script>
  <script src="/js/navbar.js?v=20"></script>
  <script src="/js/script.js?v=20"></script>
  <script>
    checkAccessCode();
    // Ak je používateľ prihlásený, tlačidlo "Začať" vedie na dashboard.
    document.addEventListener("adaptpy:auth", (e) => {
      const btn = document.getElementById("cta-btn");
      if (btn && e.detail && e.detail.student) {
        btn.setAttribute("href", "/dashboard");
      }
    });
  </script>
</body>
</html>
