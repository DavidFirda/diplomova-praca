<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Prihlásenie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/design2.css?v=17">
</head>
<body>
  <div id="navbar"></div>
  <main class="page page--narrow">
    <div class="card">
      <div class="brand-hero">
        <img src="/assets/logo.svg" alt="AdaptPy" class="brand-hero__logo" width="60" height="60" />
        <h1 data-i18n="login.title">Prihlásenie</h1>
      </div>
      <form id="login-form">
        <label data-i18n="login.identifier" for="login">Login alebo email</label>
        <input type="text" id="login" autocomplete="username" data-i18n-placeholder="login.identifier" required />
        <label data-i18n="login.password" for="password">Heslo</label>
        <input type="password" id="password" autocomplete="current-password" data-i18n-placeholder="login.password" required />
        <button type="submit" id="loginButton" data-i18n="login.submit">Prihlásiť sa</button>
      </form>
      <p id="error-message" class="error-message" style="display:none;"></p>
      <span class="bottom-link"><a href="/forgot-password" data-i18n="login.forgot">Zabudol si heslo?</a></span>
      <span class="bottom-link"><a href="/register" data-i18n="login.noAccount">Nemáš účet? Zaregistruj sa</a></span>
    </div>
  </main>
  <script src="/config.js"></script>
  <script src="/js/i18n.js?v=17"></script>
  <script src="/js/navbar.js?v=17"></script>
  <script src="/js/script.js?v=17"></script>
  <script> checkAccessCode(); </script>
</body>
</html>
