<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Prihlásenie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <!-- Ľavý panel: postavičky -->
      <div class="auth-hero">
        <div class="auth-hero__head">
          <h2 class="auth-hero__title" data-i18n="login.heroTitle">Vitaj späť!</h2>
          <p class="auth-hero__subtitle" data-i18n="login.heroSubtitle">Zadaj svoje prihlasovacie údaje.</p>
        </div>
        <div class="auth-buddies" id="buddies-mount"></div>
      </div>

      <!-- Pravý panel: formulár -->
      <div class="auth-panel">
        <h1 data-i18n="login.title">Prihlásenie</h1>
        <p class="auth-switch-line">
          <span data-i18n="login.noAccountQ">Nemáš účet?</span>
          <a href="/register" data-i18n="login.signup">Zaregistruj sa</a>
        </p>

        <form id="login-form">
          <label data-i18n="login.identifier" for="login">Login alebo email</label>
          <input type="text" id="login" autocomplete="username" placeholder="meno alebo email" required />

          <label data-i18n="login.password" for="password">Heslo</label>
          <div class="pw-field">
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="pw-toggle" data-target="password" aria-label="Zobraziť heslo">
              <svg class="pw-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye-off" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.06-5.94M9.9 4.24A10 10 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <button type="submit" id="loginButton" data-i18n="login.submit">Prihlásiť sa</button>
        </form>

        <p id="error-message" class="error-message" style="display:none;"></p>
        <span class="bottom-link"><a href="/forgot-password" data-i18n="login.forgot">Zabudol si heslo?</a></span>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/js/core/session-guard.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/navbar.js"></script>
  <script src="/js/auth/buddies.js"></script>
  <script src="/js/auth/pw-toggle.js"></script>
  <script src="/js/auth/script.js"></script>
  <script> checkAccessCode(); </script>
</body>
</html>
