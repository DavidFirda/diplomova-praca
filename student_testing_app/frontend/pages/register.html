<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Registrácia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/design.css?v=21">
</head>
<body>
  <div id="navbar"></div>
  <main class="page page--narrow">
    <div class="card">
      <div class="brand-hero">
        <img src="/assets/logo.svg" alt="AdaptPy" class="brand-hero__logo" width="60" height="60" />
        <h1 data-i18n="register.title">Registrácia</h1>
      </div>
      <form id="register-form">
        <label data-i18n="register.name" for="name">Meno</label>
        <input type="text" id="name" autocomplete="given-name" data-i18n-placeholder="register.name" required>
        <label data-i18n="register.surname" for="surname">Priezvisko</label>
        <input type="text" id="surname" autocomplete="family-name" data-i18n-placeholder="register.surname" required>
        <label data-i18n="register.email" for="email">Email</label>
        <input type="email" id="email" autocomplete="email" data-i18n-placeholder="register.email" required>
        <label data-i18n="register.login" for="login">Login</label>
        <input type="text" id="login" autocomplete="username" data-i18n-placeholder="register.login" required>
        <label data-i18n="register.password" for="password">Heslo (min. 8 znakov)</label>
        <input type="password" id="password" autocomplete="new-password" data-i18n-placeholder="register.password" required minlength="8">
        <button type="submit" data-i18n="register.submit">Zaregistrovať sa</button>
      </form>
      <p id="error-message" class="error-message" style="display:none;"></p>
      <span class="bottom-link"><a href="/login" data-i18n="register.hasAccount">Už máš účet? Prihlás sa</a></span>
    </div>
  </main>
  <script src="/config.js"></script>
  <script src="/js/i18n.js?v=21"></script>
  <script src="/js/navbar.js?v=21"></script>
  <script src="/js/script.js?v=21"></script>
  <script> checkAccessCode(); </script>
</body>
</html>
