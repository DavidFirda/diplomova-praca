<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Registrácia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="auth-wrap">
    <div class="auth-card auth-card--reverse">
      <!-- Pravý panel: postavičky (v HTML sú prvé, cez order idú doprava) -->
      <div class="auth-hero auth-hero--right">
        <div class="auth-hero__head">
          <h2 class="auth-hero__title" data-i18n="register.heroTitle">Vytvor si účet!</h2>
          <p class="auth-hero__subtitle" data-i18n="register.heroSubtitle">Pridaj sa a začni sa učiť.</p>
        </div>
        <div class="auth-buddies" id="buddies-mount"></div>
      </div>

      <!-- Ľavý panel: formulár -->
      <div class="auth-panel">
        <h1 data-i18n="register.title">Registrácia</h1>
        <p class="auth-switch-line">
          <span data-i18n="register.haveAccountQ">Už máš účet?</span>
          <a href="/login" data-i18n="register.signin">Prihlás sa</a>
        </p>

        <form id="register-form">
          <label data-i18n="register.name" for="name">Meno</label>
          <input type="text" id="name" autocomplete="given-name" placeholder="Tvoje meno" required>

          <label data-i18n="register.surname" for="surname">Priezvisko</label>
          <input type="text" id="surname" autocomplete="family-name" placeholder="Tvoje priezvisko" required>

          <label data-i18n="register.login" for="login">Login</label>
          <input type="text" id="login" autocomplete="username" placeholder="prihlasovacie meno" required>

          <label data-i18n="register.email" for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="meno@email.sk" required>

          <label data-i18n="register.password" for="password">Heslo (min. 8 znakov)</label>
          <div class="pw-field">
            <input type="password" id="password" autocomplete="new-password" placeholder="••••••••" required minlength="8">
            <button type="button" class="pw-toggle" data-target="password" aria-label="Zobraziť heslo">
              <svg class="pw-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye-off" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.06-5.94M9.9 4.24A10 10 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <button type="submit" data-i18n="register.submit">Zaregistrovať sa</button>
        </form>

        <p id="error-message" class="error-message" style="display:none;"></p>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/js/core/session-guard.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/navbar.js"></script>
  <script src="/js/auth/buddies.js"></script>
  <script src="/js/auth/pw-toggle.js"></script>
  <script src="/js/auth/script.js"></script>
  <!-- NOVÉ: registrácia cez pozvánku (musí byť pred checkAccessCode) -->
  <script src="/js/auth/invite-register.js"></script>
  <script> checkAccessCode(); </script>
</body>
</html>
