<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nastavenie nového hesla</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Nové heslo</h1>
        <form id="reset-password-form">
            <input type="password" id="new_password" placeholder="Nové heslo (min. 8 znakov)" autocomplete="new-password" required minlength="8">
            <input type="password" id="new_password_confirm" placeholder="Zopakuj nové heslo" autocomplete="new-password" required minlength="8">
            <button type="submit">Nastaviť nové heslo</button>
        </form>
        <p id="info-message" class="info-message" style="display: none; text-align: center; color: #1c3f60;"></p>
        <p id="error-message" class="error-message" style="display: none; text-align: center;"></p>
        <a class="bottom-link" href="/login">Späť na prihlásenie</a>
    </div>

    <script src="/config.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
