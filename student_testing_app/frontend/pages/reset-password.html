<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Nové heslo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="auth-wrap">
    <div class="auth-card auth-card--reverse">
      <div class="auth-hero auth-hero--right">
        <div class="auth-hero__head">
          <h2 class="auth-hero__title" data-i18n="reset.heroTitle">Takmer hotovo!</h2>
          <p class="auth-hero__subtitle" data-i18n="reset.heroSubtitle">Zvoľ si nové heslo.</p>
        </div>
        <div class="auth-buddies" id="buddies-mount"></div>
      </div>

      <div class="auth-panel">
        <h1 data-i18n="reset.title">Nové heslo</h1>
        <p class="auth-switch-line" data-i18n="reset.hint">Zadaj a potvrď svoje nové heslo.</p>

        <form id="reset-password-form">
          <label data-i18n="reset.newLabel" for="new_password">Nové heslo</label>
          <div class="pw-field">
            <input type="password" id="new_password" autocomplete="new-password" placeholder="••••••••" required minlength="8">
            <button type="button" class="pw-toggle" data-target="new_password" aria-label="Zobraziť heslo">
              <svg class="pw-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye-off" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.06-5.94M9.9 4.24A10 10 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <label data-i18n="reset.confirmLabel" for="new_password_confirm">Potvrď heslo</label>
          <div class="pw-field">
            <input type="password" id="new_password_confirm" autocomplete="new-password" placeholder="••••••••" required minlength="8">
            <button type="button" class="pw-toggle" data-target="new_password_confirm" aria-label="Zobraziť heslo">
              <svg class="pw-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye-off" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.06-5.94M9.9 4.24A10 10 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <button type="submit" data-i18n="reset.submit">Nastaviť nové heslo</button>
        </form>

        <p id="info-message" class="info-message" style="display:none;"></p>
        <p id="error-message" class="error-message" style="display:none;"></p>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/navbar.js"></script>
  <script src="/js/auth/buddies.js"></script>
  <script src="/js/auth/pw-toggle.js"></script>
  <script src="/js/auth/script.js"></script>
</body>
</html>
