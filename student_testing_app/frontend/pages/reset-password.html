<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptPy – Nové heslo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/design.css?v=20">
</head>
<body>
  <div id="navbar"></div>
  <main class="page page--narrow">
    <div class="card">
      <div class="brand-hero">
        <img src="/assets/logo.svg" alt="AdaptPy" class="brand-hero__logo" width="60" height="60" />
        <h1 data-i18n="reset.title">Nové heslo</h1>
      </div>
      <form id="reset-password-form">
        <label data-i18n="reset.new" for="new_password">Nové heslo (min. 8 znakov)</label>
        <input type="password" id="new_password" autocomplete="new-password" data-i18n-placeholder="reset.new" required minlength="8">
        <label data-i18n="reset.confirm" for="new_password_confirm">Zopakuj nové heslo</label>
        <input type="password" id="new_password_confirm" autocomplete="new-password" data-i18n-placeholder="reset.confirm" required minlength="8">
        <button type="submit" data-i18n="reset.submit">Nastaviť nové heslo</button>
      </form>
      <p id="info-message" class="info-message" style="display:none;"></p>
      <p id="error-message" class="error-message" style="display:none;"></p>
      <span class="bottom-link"><a href="/login" data-i18n="reset.back">Späť na prihlásenie</a></span>
    </div>
  </main>
  <script src="/config.js"></script>
  <script src="/js/i18n.js?v=20"></script>
  <script src="/js/navbar.js?v=20"></script>
  <script src="/js/script.js?v=20"></script>
</body>
</html>
